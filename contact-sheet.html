<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citylit · visual audit contact sheet</title>
    <style>
      body { margin: 0; background: #14161c; color: #f3efe6; font: 13px/1.4 system-ui, sans-serif; }
      header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center;
        flex-wrap: wrap; padding: 12px 16px; background: #0d0f14ee; border-bottom: 1px solid #ffffff18; }
      header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: .04em; }
      button { background: #232733; color: #f3efe6; border: 1px solid #ffffff26; border-radius: 999px;
        padding: 5px 12px; cursor: pointer; font: inherit; }
      button[aria-pressed="true"] { background: #e8b04a; color: #1a1a1a; border-color: #e8b04a; }
      #status { margin-left: auto; color: #a9a69e; }
      #stage { position: fixed; left: -10000px; top: 0; width: 400px; height: 300px; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; padding: 16px; }
      figure { margin: 0; background: #1d2029; border: 1px solid #ffffff14; border-radius: 8px; overflow: hidden; }
      figure img { display: block; width: 100%; height: 140px; object-fit: cover; background: #2a2d36; }
      figcaption { padding: 6px 8px; font-size: 11px; color: #d8d4cb; }
      figcaption span { color: #8e8b84; }
    </style>
  </head>
  <body>
    <header>
      <h1>VISUAL AUDIT</h1>
      <span>Theme</span>
      <button data-theme="dark">Dark</button>
      <button data-theme="daylight">Daylight</button>
      <button data-theme="studio">Studio</button>
      <span>Time</span>
      <button data-hour="7">Dawn</button>
      <button data-hour="12">Noon</button>
      <button data-hour="18">Dusk</button>
      <button data-hour="22">Night</button>
      <button id="refresh">Re-render all</button>
      <span id="status">Booting…</span>
    </header>
    <div id="stage" aria-hidden="true"></div>
    <main id="grid"></main>
    <script type="module" src="/src/contact-sheet.ts"></script>
  </body>
</html>
